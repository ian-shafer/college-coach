services:
  typespec-compiler:
    image: node:20-alpine
    volumes:
      - .:/workspace
    working_dir: /workspace/specs/api
    command: /bin/sh -c "npm install && npx tsp compile ."

  openapi-generator:
    image: openapitools/openapi-generator-cli:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >-
      generate
      -i /workspace/build/api/openapi3/openapi.yaml
      -g kotlin-server
      --additional-properties=library=ktor,packageName=com.echoapp
      --global-property models
      -o /workspace/build/rest-server-stubs

  openapi-generator-swift:
    image: openapitools/openapi-generator-cli:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >-
      generate
      -i /workspace/build/api/openapi3/openapi.yaml
      -g swift5
      --additional-properties=projectName=EchoAPI
      -o /workspace/build/ios-client-stubs

  rest-server:
    image: gradle:8.5-jdk21
    volumes:
      - .:/workspace
    working_dir: /workspace/rest-server
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file: .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
    command: gradle run

  test-runner:
    image: gradle:8.5-jdk21
    volumes:
      - .:/workspace
    working_dir: /workspace/rest-server
    env_file: .env
    command: gradle clean test

  api-test:
    image: schemathesis/schemathesis:stable
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >-
      run /workspace/build/api/openapi3/openapi.yaml
      --url http://rest-server:8080
      --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
